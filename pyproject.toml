[tool.hatch.envs.default]
path = ".hatch"
python = "3.12"

[tool.hatch.version]
path = "src/nichenetpy/__init__.py"

[project]
name = "nichenetpy"
dynamic = ["version"]
license = "BSD-3-Clause"
license-files = ["LICEN[CS]E*"]

description = """
nichenetpy: the python implementation of the NicheNet method.
The goal of NicheNet is to study intercellular communication from a computational perspective.
NicheNet uses human or mouse gene expression data of interacting cells as input and combines this
with a prior model that integrates existing knowledge on ligand-to-target signaling paths.
This allows to predict ligand-receptor interactions that might drive gene expression changes in cells of interest. 
"""

authors = [
  { name = "Victor Medaerts", email = "victor.medaerts@ugent.be"},
]

maintainers = [
  { name = "Victor Medaerts", email = "victor.medaerts@ugent.be"},
]

requires-python = "==3.12.*"

dependencies = [
    "scikit-learn>=1.5.2",
    "scikit-network>=0.33.1",
    "anndata>=0.11.1",
    "scanpy>=1.10.4",
    "numpy>=2.0.2",
    "matplotlib>=3.9.3",
    "pyCirclize>=1.9.0",
    "scipy>=1.14.1",
    "pandas>=2.2.3",
    "networkx>=3.4.2",
    "adjustText>=1.3.0"
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.12",
]

[project.urls]
"Source" = "https://github.com/saeyslab/nichenetpy"

[tool.pytest.ini_options]
markers = [
    "large_download",
]

[tool.hatch.build.targets.sdist]
packages = ["src/nichenetpy"]
include = [
  "src/nichenetpy/*.py"
]

[tool.hatch.build.targets.wheel]
packages = ["src/nichenetpy"]
include = [
  "src/nichenetpy/*.py",
]

[tool.hatch.envs.hatch-build]
installer = "pip"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"